<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>

    <!-- ŁADOWANIE CSS MOTYWU LIGHTSPEED -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body>

    <!-- HERO / HEADER -->
    <header class="hero">
      <h1>{{ site.title | default: "Moja wersja Lightspeed" }}</h1>
      <p>{{ site.subtitle | default: "Mój własny podtytuł" }}</p>
    </header>

    <!-- TREŚĆ STRONY -->
    <main class="container">
      {{ content }}
    </main>

  </body>
</html>
